name: Build Flutter APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Extract Zip and Migrate to Clean Project
        run: |
          mkdir -p extracted_zip
          unzip -q m.zip -d extracted_zip
          flutter create mysurveyapp --org com.mysurvey --platforms=android
          cd extracted_zip
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "lib" | head -n 1 | sed 's|/lib||')
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          if [ -d "$TARGET_DIR/lib" ]; then
            rm -rf ../mysurveyapp/lib/*
            cp -r $TARGET_DIR/lib/* ../mysurveyapp/lib/
          fi
          if [ -d "$TARGET_DIR/assets" ]; then
            cp -r $TARGET_DIR/assets ../mysurveyapp/ 2>/dev/null || true
          fi
          if [ -f "$TARGET_DIR/pubspec.yaml" ]; then
            cp $TARGET_DIR/pubspec.yaml ../mysurveyapp/
          fi
          cd ..
          cd mysurveyapp
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mysurveyapp/build/app/outputs/flutter-apk/app-debug.apk
