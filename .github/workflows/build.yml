name: Build Flutter APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Extract m.zip and Build
        run: |
          mkdir -p project_source
          unzip -q m.zip -d project_source
          
          # الدخول للمجلد المستخرج
          cd project_source
          
          # إذا كان الملف المضغوط يحتوي على مجلد داخلي، ندخل إليه، وإلا نبقى في نفس المجلد
          if [ -d "mysurveyapp" ]; then
            cd mysurveyapp
          elif [ -d "$(ls -d */ | head -n 1)" ]; then
            cd "$(ls -d */ | head -n 1)"
          fi
          
          # التأكد من وجود ملف pubspec.yaml وبناء التطبيق
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/app/outputs/flutter-apk/app-debug.apk'
